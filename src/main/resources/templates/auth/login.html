<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="content">
    <div class="auth-wrapper">

      <div class="auth-header">
        <div class="auth-logo-mark">
          <i class="bi bi-building" style="font-size:1.6rem;color:#fff;"></i>
        </div>
        <h1 class="auth-title">Everspin Meeting</h1>
        <p class="auth-subtitle">계정에 로그인하여 회의실을 예약하세요</p>
      </div>

      <div th:if="${param.error}" class="alert-danger mb-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        아이디 또는 비밀번호가 올바르지 않습니다.
      </div>
      <div th:if="${param.logout}" class="alert-success mb-2">
        <i class="bi bi-check-circle-fill"></i>
        성공적으로 로그아웃되었습니다.
      </div>
      <div th:if="${param.registered}" class="alert-success mb-2">
        <i class="bi bi-check-circle-fill"></i>
        회원가입이 완료되었습니다. 로그인해주세요.
      </div>

      <div class="card">
        <div class="card-top">
          <h2>로그인</h2>
          <p>Welcome back!</p>
        </div>
        <div class="card-bottom">
          <form th:action="@{/auth/login-process}" method="post">
            <div class="mb-2">
              <label class="form-label" for="username">아이디</label>
              <input type="text" id="username" name="username"
                     class="form-control"
                     placeholder="아이디를 입력하세요" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">비밀번호</label>
              <input type="password" id="password" name="password"
                     class="form-control"
                     placeholder="비밀번호를 입력하세요" required>
            </div>

            <button class="btn-primary w-100 justify-center" type="submit"
                    style="font-size:0.95rem;padding:0.8rem;">
              <i class="bi bi-arrow-right-circle"></i> 로그인
            </button>
          </form>

          <hr class="divider">

          <div class="text-center">
            <span class="color-sub" style="font-size:0.875rem;">계정이 없으신가요?</span>
            <a th:href="@{/auth/signup}" class="auth-link">회원가입 →</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
