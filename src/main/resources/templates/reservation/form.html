<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="content">
    <div class="container-md">

      <div class="page-header-back">
        <a th:href="@{/reservations}" class="btn-secondary btn-round btn-sm">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h1 class="page-title">회의실 예약 신청</h1>
          <p class="page-subtitle">예약 정보를 입력해주세요</p>
        </div>
      </div>

      <div th:if="${errorMessage}" class="alert-danger mb-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}">오류</span>
      </div>
      <style>
        .time-row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.75rem;
        }

        .time-row label {
          display: block;
          margin-bottom: 0.4rem;
        }

        .attendees-stepper {
          display: flex;
          align-items: center;
          background: var(--white);
          border: 1px solid var(--border);
          border-radius: var(--radius-sm);
          overflow: hidden;
          width: fit-content;
          min-width: 150px;
        }

        .stepper-btn {
          width: 40px;
          height: 40px;
          background: var(--bg);
          border: none;
          color: var(--text-main);
          font-size: 1.2rem;
          font-weight: 500;
          cursor: pointer;
          transition: var(--transition);
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .stepper-btn:hover {
          background: var(--border);
        }

        .stepper-display {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.2rem;
        }

        .stepper-input {
          width: 100%;
          border: none;
          background: transparent;
          text-align: center;
          font-size: 1rem;
          font-weight: 600;
          color: var(--text-main);
          outline: none;
          padding: 0;
          font-family: 'Inter', sans-serif;
          -moz-appearance: textfield;
        }

        .stepper-input::-webkit-outer-spin-button,
        .stepper-input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }

        .stepper-unit {
          color: var(--text-sub);
          font-size: 0.8rem;
          font-weight: 500;
          flex-shrink: 0;
        }

        .booking-summary {
          background: var(--blue-light);
          border: 1px solid var(--blue-mid);
          border-radius: var(--radius-sm);
          padding: 1rem 1.25rem;
          margin-bottom: 1.5rem;
          display: none;
        }

        .booking-summary.visible {
          display: block;
        }

        .booking-summary-label {
          font-size: 0.72rem;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: var(--blue);
          margin-bottom: 0.4rem;
        }

        .booking-summary-value {
          font-size: 0.95rem;
          font-weight: 600;
          color: var(--text-main);
        }

        .booking-duration-badge {
          display: inline-flex;
          align-items: center;
          gap: 0.3rem;
          background: #ECFDF5;
          border: 1px solid #A7F3D0;
          color: #059669;
          font-size: 0.78rem;
          font-weight: 600;
          padding: 0.25rem 0.7rem;
          border-radius: 50px;
        }
      </style>

      <div class="card">
        <div class="card-body">
          <form th:action="@{/reservations/new}" th:object="${reservationRequest}" method="post" id="reservationForm">

            <input type="hidden" id="roomIdHidden" name="roomId" th:value="${reservationRequest.roomId}">

            <!-- 회의실 선택 -->
            <div class="mb-3">
              <label class="form-label">회의실 선택</label>
              <select id="roomSelect" class="form-select"
                th:classappend="${#fields.hasErrors('roomId')} ? ' is-invalid'">
                <option value="">회의실을 선택하세요</option>
                <option th:each="room : ${rooms}" th:value="${room.id}" th:attr="data-capacity=${room.capacity}"
                  th:text="${room.name} + '  (최대 ' + ${room.capacity} + '명)'"
                  th:selected="${param.roomId != null && param.roomId[0] == #strings.toString(room.id)}">
                </option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></div>
            </div>

            <!-- 회의 제목 -->
            <div class="mb-3">
              <label class="form-label">회의 제목</label>
              <input type="text" th:field="*{title}" class="form-control"
                th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'" placeholder="예: 주간 업무 보고, 프로젝트 킥오프">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <!-- 시작·종료 시간 (min/step으로 과거·30분 단위를 브라우저가 검증) -->
            <div class="mb-3">
              <div class="time-row">
                <div>
                  <label class="form-label">시작 시간</label>
                  <input type="datetime-local" id="startTime" th:field="*{startTime}" class="form-control"
                    step="1800" required th:classappend="${#fields.hasErrors('startTime')} ? ' is-invalid'">
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                </div>
                <div>
                  <label class="form-label">종료 시간</label>
                  <input type="datetime-local" id="endTime" th:field="*{endTime}" class="form-control"
                    step="1800" required th:classappend="${#fields.hasErrors('endTime')} ? ' is-invalid'">
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
                </div>
              </div>
            </div>

            <!-- 예약 시간 요약 미리보기 -->
            <div class="booking-summary" id="bookingSummary">
              <div class="d-flex align-center justify-between flex-wrap gap-sm">
                <div>
                  <div class="booking-summary-label"><i class="bi bi-clock"></i> 예약 시간 요약</div>
                  <div class="booking-summary-value" id="summaryText">-</div>
                </div>
                <div class="booking-duration-badge">
                  <i class="bi bi-hourglass-split"></i>
                  <span id="durationText">-</span>
                </div>
              </div>
            </div>

            <!-- 참석 인원수 -->
            <div class="mb-3">
              <label class="form-label">참석 인원수</label>
              <div class="d-flex align-center gap-1">
                <div class="attendees-stepper">
                  <button type="button" class="stepper-btn" id="decreaseBtn" onclick="changeAttendees(-1)">−</button>
                  <div class="stepper-display">
                    <input type="number" id="attendeesInput" name="attendees"
                      th:value="${reservationRequest.attendees != null ? reservationRequest.attendees : 1}"
                      class="stepper-input" min="1" value="1">
                    <span class="stepper-unit">명</span>
                  </div>
                  <button type="button" class="stepper-btn" id="increaseBtn" onclick="changeAttendees(1)">+</button>
                </div>
                <p class="hint-text" id="capacityHint"></p>
              </div>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('attendees')}" th:errors="*{attendees}"></div>
            </div>

            <!-- 설명 -->
            <div class="mb-3">
              <label class="form-label">
                예약 목적 및 설명 <span class="optional-label">(선택)</span>
              </label>
              <textarea th:field="*{description}" class="form-control" rows="3"
                placeholder="회의 목적, 준비 사항 등을 입력하세요."></textarea>
            </div>

            <hr class="divider">
            <div class="form-actions">
              <a th:href="@{/reservations}" class="btn-secondary">
                <i class="bi bi-x-lg"></i> 취소
              </a>
              <button type="submit" class="btn-primary">
                <i class="bi bi-check-lg"></i> 예약 신청하기
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>

    <script>
      var currentAttendees = 1;
      var maxCapacity = 999;
      var startTime = document.getElementById('startTime');
      var endTime = document.getElementById('endTime');
      var BUSINESS_HOURS_MSG = '07시~22시 사이만 예약할 수 있습니다.';

      // Date -> datetime-local이 요구하는 'YYYY-MM-DDTHH:MM' (로컬 시각) 문자열
      function toLocalValue(date) {
        return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      }

      // min을 다음 30분 경계로 맞춘다 — step은 min 기준이라 이래야 :00/:30에만 걸린다
      var earliest = new Date();
      earliest.setSeconds(0, 0);
      earliest.setMinutes(earliest.getMinutes() > 30 ? 60 : 30);
      startTime.min = endTime.min = toLocalValue(earliest);

      // 업무 시간(07~22시) 밖인지 — 값이 비었으면 required가 처리하므로 통과시킨다
      function outOfHours(input) {
        var hour = parseInt(input.value.slice(11, 13));
        return input.value !== '' && (hour < 7 || hour > 22);
      }

      // HTML 속성으로 표현할 수 없는 규칙만 직접 검사 (과거·30분 단위·필수는 min/step/required 담당)
      function validateTimes() {
        startTime.setCustomValidity(outOfHours(startTime) ? BUSINESS_HOURS_MSG : '');
        endTime.setCustomValidity(
          outOfHours(endTime) ? BUSINESS_HOURS_MSG
            : (startTime.value && endTime.value && endTime.value <= startTime.value)
              ? '종료 시간은 시작 시간보다 이후여야 합니다.' : '');
        updateSummary();
      }

      // 예약 시간 요약 박스를 갱신 (종료가 시작보다 이전이면 숨김)
      function updateSummary() {
        var summary = document.getElementById('bookingSummary');
        var diffMs = new Date(endTime.value) - new Date(startTime.value);
        if (!startTime.value || !endTime.value || !(diffMs > 0)) {
          summary.classList.remove('visible');
          return;
        }
        var diffH = Math.floor(diffMs / 3600000);
        var diffM = Math.floor((diffMs % 3600000) / 60000);
        var durStr = (diffH > 0 ? diffH + '시간' : '') + (diffM > 0 ? (diffH > 0 ? ' ' : '') + diffM + '분' : '');
        var startDate = new Date(startTime.value);
        document.getElementById('summaryText').textContent =
          (startDate.getMonth() + 1) + '월 ' + startDate.getDate() + '일  ' +
          startTime.value.slice(11) + ' ~ ' + endTime.value.slice(11);
        document.getElementById('durationText').textContent = durStr;
        summary.classList.add('visible');
      }

      [startTime, endTime].forEach(function (input) {
        input.addEventListener('change', validateTimes);
      });

      // 인원수 스테퍼의 +/- 버튼 활성 여부를 현재 값·최대 정원 기준으로 동기화
      function syncStepper() {
        var input = document.getElementById('attendeesInput');
        currentAttendees = parseInt(input.value) || 1;
        document.getElementById('decreaseBtn').disabled = (currentAttendees <= 1);
        document.getElementById('increaseBtn').disabled = (currentAttendees >= maxCapacity);
      }

      // 인원수 +/- 버튼 클릭 시 범위 내에서 값 변경
      function changeAttendees(delta) {
        var next = currentAttendees + delta;
        if (next < 1 || next > maxCapacity) return;
        currentAttendees = next;
        document.getElementById('attendeesInput').value = currentAttendees;
        syncStepper();
      }

      // 인원수 직접 입력 시 1 ~ 최대 정원 범위로 클램핑
      document.getElementById('attendeesInput').addEventListener('input', function () {
        var val = parseInt(this.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > maxCapacity) val = maxCapacity;
        this.value = val;
        currentAttendees = val;
        syncStepper();
      });

      // 회의실 변경 시 hidden roomId 업데이트 및 정원 힌트 표시
      document.getElementById('roomSelect').addEventListener('change', function () {
        document.getElementById('roomIdHidden').value = this.value;
        var opt = this.options[this.selectedIndex];
        if (!opt.value) return;
        var cap = parseInt(opt.getAttribute('data-capacity')) || 999;
        maxCapacity = cap;
        var hint = document.getElementById('capacityHint');
        hint.textContent = cap < 999 ? '이 회의실 최대 ' + cap + '명' : '';
        if (currentAttendees > maxCapacity) {
          currentAttendees = maxCapacity;
          document.getElementById('attendeesInput').value = currentAttendees;
        }
        syncStepper();
      });

      validateTimes();
      syncStepper();
      // 회의실이 이미 선택된 상태(재진입 시)라면 정원 힌트 즉시 업데이트
      var initRoom = document.getElementById('roomSelect');
      if (initRoom.value) { initRoom.dispatchEvent(new Event('change')); }
    </script>

  </div>
</body>

</html>
