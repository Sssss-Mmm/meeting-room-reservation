<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="content">
    <div class="container-md">

      <div class="page-header-back">
        <a th:href="@{/reservations}" class="btn-secondary btn-round btn-sm">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h1 class="page-title">회의실 예약 신청</h1>
          <p class="page-subtitle">예약 정보를 입력해주세요</p>
        </div>
      </div>

      <div th:if="${errorMessage}" class="alert-danger mb-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}">오류</span>
      </div>
      <!-- Flatpickr CSS -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
      <style>
        .flatpickr-calendar {
          font-family: 'Inter', sans-serif !important;
          box-shadow: var(--shadow-md) !important;
          border: 1px solid var(--border) !important;
          border-radius: var(--radius) !important;
        }

        .flatpickr-day.selected {
          background: var(--blue) !important;
          border-color: var(--blue) !important;
        }

        .date-input-wrapper {
          position: relative;
        }

        .date-input-wrapper .bi {
          position: absolute;
          right: 14px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--text-light);
          pointer-events: none;
          font-size: 1rem;
        }

        .date-input-wrapper input {
          padding-right: 2.5rem;
          cursor: pointer;
        }

        .time-row {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          gap: 0.5rem;
          align-items: end;
        }

        .time-col label {
          display: block;
          margin-bottom: 0.4rem;
        }

        .time-inner {
          display: flex;
          gap: 0.4rem;
          align-items: center;
        }

        .time-inner select {
          flex: 1;
        }

        .time-sep-col {
          display: flex;
          align-items: center;
          padding-bottom: 0.1rem;
        }

        .time-arrow {
          font-size: 1.1rem;
          color: var(--text-light);
          margin-bottom: 0.35rem;
        }

        .attendees-stepper {
          display: flex;
          align-items: center;
          background: var(--white);
          border: 1px solid var(--border);
          border-radius: var(--radius-sm);
          overflow: hidden;
          width: fit-content;
          min-width: 150px;
        }

        .stepper-btn {
          width: 40px;
          height: 40px;
          background: var(--bg);
          border: none;
          color: var(--text-main);
          font-size: 1.2rem;
          font-weight: 500;
          cursor: pointer;
          transition: var(--transition);
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .stepper-btn:hover {
          background: var(--border);
        }

        .stepper-display {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.2rem;
        }

        .stepper-input {
          width: 100%;
          border: none;
          background: transparent;
          text-align: center;
          font-size: 1rem;
          font-weight: 600;
          color: var(--text-main);
          outline: none;
          padding: 0;
          font-family: 'Inter', sans-serif;
          -moz-appearance: textfield;
        }

        .stepper-input::-webkit-outer-spin-button,
        .stepper-input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }

        .stepper-unit {
          color: var(--text-sub);
          font-size: 0.8rem;
          font-weight: 500;
          flex-shrink: 0;
        }

        .booking-summary {
          background: var(--blue-light);
          border: 1px solid var(--blue-mid);
          border-radius: var(--radius-sm);
          padding: 1rem 1.25rem;
          margin-bottom: 1.5rem;
          display: none;
        }

        .booking-summary.visible {
          display: block;
        }

        .booking-summary-label {
          font-size: 0.72rem;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: var(--blue);
          margin-bottom: 0.4rem;
        }

        .booking-summary-value {
          font-size: 0.95rem;
          font-weight: 600;
          color: var(--text-main);
        }

        .booking-duration-badge {
          display: inline-flex;
          align-items: center;
          gap: 0.3rem;
          background: #ECFDF5;
          border: 1px solid #A7F3D0;
          color: #059669;
          font-size: 0.78rem;
          font-weight: 600;
          padding: 0.25rem 0.7rem;
          border-radius: 50px;
        }
      </style>

      <div class="card">
        <div class="card-body">
          <form th:action="@{/reservations/new}" th:object="${reservationRequest}" method="post" id="reservationForm">

            <input type="hidden" id="startTime" name="startTime" th:field="*{startTime}">
            <input type="hidden" id="endTime" name="endTime" th:field="*{endTime}">
            <input type="hidden" id="roomIdHidden" name="roomId" th:value="${reservationRequest.roomId}">

            <!-- 회의실 선택 -->
            <div class="mb-3">
              <label class="form-label">회의실 선택</label>
              <select id="roomSelect" class="form-select"
                th:classappend="${#fields.hasErrors('roomId')} ? ' is-invalid'">
                <option value="">회의실을 선택하세요</option>
                <option th:each="room : ${rooms}" th:value="${room.id}" th:attr="data-capacity=${room.capacity}"
                  th:text="${room.name} + '  (최대 ' + ${room.capacity} + '명)'"
                  th:selected="${param.roomId != null && param.roomId[0] == #strings.toString(room.id)}">
                </option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></div>
            </div>

            <!-- 회의 제목 -->
            <div class="mb-3">
              <label class="form-label">회의 제목</label>
              <input type="text" th:field="*{title}" class="form-control"
                th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'" placeholder="예: 주간 업무 보고, 프로젝트 킥오프">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <!-- 날짜 선택 -->
            <div class="mb-2">
              <label class="form-label">회의 날짜</label>
              <div class="date-input-wrapper">
                <input type="text" id="datePicker" class="form-control" placeholder="날짜를 선택하세요" readonly>
                <i class="bi bi-calendar3"></i>
              </div>
            </div>

            <!-- 시작·종료 시간 -->
            <div class="mb-3">
              <div class="time-row">
                <div class="time-col">
                  <label class="form-label">시작 시간</label>
                  <div class="time-inner">
                    <select id="startHour" class="form-select"></select>
                    <span class="fw-600">:</span>
                    <select id="startMin" class="form-select">
                      <option value="00">00분</option>
                      <option value="30">30분</option>
                    </select>
                  </div>
                </div>
                <div class="time-sep-col">
                  <span class="time-arrow"><i class="bi bi-arrow-right"></i></span>
                </div>
                <div class="time-col">
                  <label class="form-label">종료 시간</label>
                  <div class="time-inner">
                    <select id="endHour" class="form-select"></select>
                    <span class="fw-600">:</span>
                    <select id="endMin" class="form-select">
                      <option value="00">00분</option>
                      <option value="30">30분</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- 예약 시간 요약 미리보기 -->
            <div class="booking-summary" id="bookingSummary">
              <div class="d-flex align-center justify-between flex-wrap gap-sm">
                <div>
                  <div class="booking-summary-label"><i class="bi bi-clock"></i> 예약 시간 요약</div>
                  <div class="booking-summary-value" id="summaryText">-</div>
                </div>
                <div class="booking-duration-badge">
                  <i class="bi bi-hourglass-split"></i>
                  <span id="durationText">-</span>
                </div>
              </div>
            </div>

            <!-- 참석 인원수 -->
            <div class="mb-3">
              <label class="form-label">참석 인원수</label>
              <div class="d-flex align-center gap-1">
                <div class="attendees-stepper">
                  <button type="button" class="stepper-btn" id="decreaseBtn" onclick="changeAttendees(-1)">−</button>
                  <div class="stepper-display">
                    <input type="number" id="attendeesInput" name="attendees"
                      th:value="${reservationRequest.attendees != null ? reservationRequest.attendees : 1}"
                      class="stepper-input" min="1" value="1">
                    <span class="stepper-unit">명</span>
                  </div>
                  <button type="button" class="stepper-btn" id="increaseBtn" onclick="changeAttendees(1)">+</button>
                </div>
                <p class="hint-text" id="capacityHint"></p>
              </div>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('attendees')}" th:errors="*{attendees}"></div>
            </div>

            <!-- 설명 -->
            <div class="mb-3">
              <label class="form-label">
                예약 목적 및 설명 <span class="optional-label">(선택)</span>
              </label>
              <textarea th:field="*{description}" class="form-control" rows="3"
                placeholder="회의 목적, 준비 사항 등을 입력하세요."></textarea>
            </div>

            <hr class="divider">
            <div class="form-actions">
              <a th:href="@{/reservations}" class="btn-secondary">
                <i class="bi bi-x-lg"></i> 취소
              </a>
              <button type="submit" class="btn-primary">
                <i class="bi bi-check-lg"></i> 예약 신청하기
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script>
      var selectedDate = '';
      var currentAttendees = 1;
      var maxCapacity = 999;

      // 오늘 날짜를 'YYYY-MM-DD' 형식 문자열로 반환
      function getTodayStr() {
        var today = new Date();
        return today.getFullYear() + '-' +
          String(today.getMonth() + 1).padStart(2, '0') + '-' +
          String(today.getDate()).padStart(2, '0');
      }

      // 시작·종료 시간 셀렉트를 07~22시 옵션으로 채우고, 현재 시각 기준 가장 가까운 30분 단위로 기본값 설정
      function initHourSelects() {
        ['startHour', 'endHour'].forEach(function (id) {
          var selectElement = document.getElementById(id);
          for (var hour = 7; hour <= 22; hour++) {
            var optionElement = document.createElement('option');
            optionElement.value = String(hour).padStart(2, '0');
            optionElement.textContent = String(hour).padStart(2, '0') + '시';
            selectElement.appendChild(optionElement);
          }
        });
        var now = new Date();
        var nextHour = now.getHours();
        var nextMin = now.getMinutes() < 30 ? 30 : 0;
        if (nextMin === 0) nextHour += 1;
        nextHour = Math.min(Math.max(nextHour, 7), 21);
        document.getElementById('startHour').value = String(nextHour).padStart(2, '0');
        document.getElementById('startMin').value = String(nextMin).padStart(2, '0');
        document.getElementById('endHour').value = String(Math.min(nextHour + 1, 22)).padStart(2, '0');
        document.getElementById('endMin').value = String(nextMin).padStart(2, '0');
      }

      // 오늘 날짜가 선택된 경우 이미 지난 시간 옵션을 disabled 처리
      function disablePastHours() {
        if (!selectedDate) return;
        var isToday = (selectedDate === getTodayStr());
        var now = new Date();
        var curHour = now.getHours();
        var curMin = now.getMinutes();
        ['startHour', 'endHour'].forEach(function (id) {
          var selectElement = document.getElementById(id);
          Array.from(selectElement.options).forEach(function (optionElement) {
            var hour = parseInt(optionElement.value);
            optionElement.disabled = isToday && (hour < curHour || (hour === curHour && curMin >= 30));
          });
          if (selectElement.options[selectElement.selectedIndex] && selectElement.options[selectElement.selectedIndex].disabled) {
            for (var i = 0; i < selectElement.options.length; i++) {
              if (!selectElement.options[i].disabled) { selectElement.value = selectElement.options[i].value; break; }
            }
          }
        });
        ['startHour:startMin', 'endHour:endMin'].forEach(function (pair) {
          var parts = pair.split(':');
          var hSelectElement = document.getElementById(parts[0]);
          var mSelectElement = document.getElementById(parts[1]);
          var selHour = parseInt(hSelectElement.value);
          Array.from(mSelectElement.options).forEach(function (optionElement) {
            optionElement.disabled = isToday && selHour === curHour && parseInt(optionElement.value) <= curMin;
          });
          if (mSelectElement.options[mSelectElement.selectedIndex] && mSelectElement.options[mSelectElement.selectedIndex].disabled) {
            mSelectElement.value = '30';
          }
        });
      }

      // 선택한 날짜와 시간을 조합해 hidden input(startTime, endTime)에 ISO 형식으로 저장
      function syncHiddenFields() {
        if (!selectedDate) return;
        var startHour = document.getElementById('startHour').value;
        var startMin = document.getElementById('startMin').value;
        var endHour = document.getElementById('endHour').value;
        var endMin = document.getElementById('endMin').value;
        document.getElementById('startTime').value = selectedDate + 'T' + startHour + ':' + startMin;
        document.getElementById('endTime').value = selectedDate + 'T' + endHour + ':' + endMin;
        updateSummary();
      }

      // 예약 시간 요약 박스를 갱신 (날짜·시간·소요 시간 표시, 종료가 시작보다 이전이면 숨김)
      function updateSummary() {
        var summary = document.getElementById('bookingSummary');
        if (!selectedDate) { summary.classList.remove('visible'); return; }
        var startHour = document.getElementById('startHour').value;
        var startMin = document.getElementById('startMin').value;
        var endHour = document.getElementById('endHour').value;
        var endMin = document.getElementById('endMin').value;
        var startDT = new Date(selectedDate + 'T' + startHour + ':' + startMin);
        var endDT = new Date(selectedDate + 'T' + endHour + ':' + endMin);
        var diffMs = endDT - startDT;
        if (diffMs <= 0) { summary.classList.remove('visible'); return; }
        var diffH = Math.floor(diffMs / 3600000);
        var diffM = Math.floor((diffMs % 3600000) / 60000);
        var durStr = '';
        if (diffH > 0) durStr += diffH + '시간';
        if (diffM > 0) durStr += (durStr ? ' ' : '') + diffM + '분';
        var dateObj = new Date(selectedDate);
        var dateLabel = (dateObj.getMonth() + 1) + '월 ' + dateObj.getDate() + '일';
        document.getElementById('summaryText').textContent = dateLabel + '  ' + sh + ':' + sm + ' ~ ' + eh + ':' + em;
        document.getElementById('durationText').textContent = durStr;
        summary.classList.add('visible');
      }

      // Flatpickr 날짜 선택기 초기화 (오늘 이후만 선택 가능, 날짜 변경 시 시간 재검증)
      flatpickr('#datePicker', {
        locale: 'ko',
        dateFormat: 'Y-m-d',
        minDate: 'today',
        disableMobile: true,
        onChange: function (selectedDates, dateStr) {
          selectedDate = dateStr;
          disablePastHours();
          syncHiddenFields();
        }
      });

      // 시간 셀렉트 변경 시 hidden input 동기화
      ['startHour', 'startMin', 'endHour', 'endMin'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () {
          if (id === 'startHour' || id === 'endHour') disablePastHours();
          syncHiddenFields();
        });
      });

      // 인원수 스테퍼의 +/- 버튼 활성 여부를 현재 값·최대 정원 기준으로 동기화
      function syncStepper() {
        var input = document.getElementById('attendeesInput');
        currentAttendees = parseInt(input.value) || 1;
        document.getElementById('decreaseBtn').disabled = (currentAttendees <= 1);
        document.getElementById('increaseBtn').disabled = (currentAttendees >= maxCapacity);
      }

      // 인원수 +/- 버튼 클릭 시 범위 내에서 값 변경
      function changeAttendees(delta) {
        var next = currentAttendees + delta;
        if (next < 1 || next > maxCapacity) return;
        currentAttendees = next;
        document.getElementById('attendeesInput').value = currentAttendees;
        syncStepper();
      }

      // 인원수 직접 입력 시 1 ~ 최대 정원 범위로 클램핑
      document.getElementById('attendeesInput').addEventListener('input', function () {
        var val = parseInt(this.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > maxCapacity) val = maxCapacity;
        this.value = val;
        currentAttendees = val;
        syncStepper();
      });

      // 회의실 변경 시 hidden roomId 업데이트 및 정원 힌트 표시
      document.getElementById('roomSelect').addEventListener('change', function () {
        document.getElementById('roomIdHidden').value = this.value;
        var opt = this.options[this.selectedIndex];
        if (!opt.value) return;
        var cap = parseInt(opt.getAttribute('data-capacity')) || 999;
        maxCapacity = cap;
        var hint = document.getElementById('capacityHint');
        hint.textContent = cap < 999 ? '이 회의실 최대 ' + cap + '명' : '';
        if (currentAttendees > maxCapacity) {
          currentAttendees = maxCapacity;
          document.getElementById('attendeesInput').value = currentAttendees;
        }
        syncStepper();
      });

      // 폼 제출 전 클라이언트 유효성 검사 (날짜 미선택, 시간 역전, 과거 시간 차단)
      document.getElementById('reservationForm').addEventListener('submit', function (e) {
        syncHiddenFields();
        if (!selectedDate) { e.preventDefault(); alert('날짜를 선택해주세요.'); return; }
        var attendees = parseInt(document.getElementById('attendeesInput').value);
        if (!attendees || attendees < 1) { e.preventDefault(); alert('참석 인원을 입력해주세요.'); return; }
        var startTime = document.getElementById('startTime').value;
        var endTime = document.getElementById('endTime').value;
        if (new Date(startTime) >= new Date(endTime)) { e.preventDefault(); alert('종료 시간은 시작 시간보다 이후여야 합니다.'); return; }
        if (new Date(startTime) <= new Date()) { e.preventDefault(); alert('과거 시간으로는 예약할 수 없습니다.'); return; }
      });

      initHourSelects();
      syncStepper();
      // 회의실이 이미 선택된 상태(재진입 시)라면 정원 힌트 즉시 업데이트
      var initRoom = document.getElementById('roomSelect');
      if (initRoom.value) { initRoom.dispatchEvent(new Event('change')); }
    </script>

  </div>
</body>

</html>
