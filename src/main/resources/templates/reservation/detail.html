<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="content">
    <div class="container-md">

      <div class="page-header-back">
        <a th:href="@{/reservations}" class="btn-secondary btn-round btn-sm">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h1 class="page-title">예약 상세 내역</h1>
          <p class="page-subtitle">예약 정보를 확인하세요</p>
        </div>
      </div>

      <div th:if="${errorMessage}" class="alert-danger mb-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
      </div>

      <!-- 상태 배너 -->
      <div class="status-banner">
        <div class="flex-1">
          <p class="info-label">예약 상태</p>
          <span th:if="${reservation.status.name() == 'PENDING'}" class="badge badge-pending"
            style="font-size:0.85rem;padding:0.4rem 1rem;">⏳ 승인 대기 중</span>
          <span th:if="${reservation.status.name() == 'CONFIRMED'}" class="badge badge-confirmed"
            style="font-size:0.85rem;padding:0.4rem 1rem;">✅ 확정됨</span>
          <span th:if="${reservation.status.name() == 'REJECTED'}" class="badge badge-rejected"
            style="font-size:0.85rem;padding:0.4rem 1rem;">❌ 반려됨</span>
          <span th:if="${reservation.status.name() == 'CANCELLED'}" class="badge badge-cancelled"
            style="font-size:0.85rem;padding:0.4rem 1rem;">🚫 취소됨</span>
        </div>
        <div class="text-right">
          <p class="info-label">예약 번호</p>
          <span class="reservation-id" th:text="${reservation.id}">-</span>
        </div>
      </div>

      <!-- 상세 -->
      <div class="card">
        <div class="card-body" style="padding-bottom:0.5rem;">
          <h2 style="font-size:1.1rem;font-weight:700;margin:0;" th:text="${reservation.title}">제목</h2>
        </div>
        <div class="card-body" style="padding-top:1rem;">

          <div class="info-grid">

            <div class="info-cell">
              <p class="info-label"><i class="bi bi-door-open"></i> 회의실</p>
              <p class="info-value" th:text="${reservation.room.name}">-</p>
            </div>

            <div class="info-cell">
              <p class="info-label"><i class="bi bi-people-fill"></i> 참석 인원</p>
              <p class="info-value" th:text="${reservation.attendees} + '명'">-</p>
            </div>

            <div class="info-cell">
              <p class="info-label"><i class="bi bi-calendar-event"></i> 시작 일시</p>
              <p class="info-value-mono" th:text="${#temporals.format(reservation.startTime, 'yyyy-MM-dd HH:mm')}">-</p>
            </div>

            <div class="info-cell">
              <p class="info-label"><i class="bi bi-calendar-check"></i> 종료 일시</p>
              <p class="info-value-mono" th:text="${#temporals.format(reservation.endTime, 'yyyy-MM-dd HH:mm')}">-</p>
            </div>

          </div>

          <div th:if="${reservation.description != null and !#strings.isEmpty(reservation.description)}"
            class="info-cell mt-2">
            <p class="info-label"><i class="bi bi-chat-left-text"></i> 설명</p>
            <p class="info-value-desc" th:text="${reservation.description}">-</p>
          </div>

          <div th:if="${reservation.status.name() == 'REJECTED'}" class="info-cell-danger mt-2">
            <p class="info-label-danger"><i class="bi bi-x-circle"></i> 반려 사유</p>
            <p class="info-value-danger" th:text="${reservation.rejectReason}">-</p>
          </div>

          <hr class="divider">
          <div class="d-flex align-center justify-between">
            <a th:href="@{/reservations}" class="btn-secondary">
              <i class="bi bi-arrow-left"></i> 목록으로
            </a>
            <form th:if="${reservation.status.name() == 'PENDING' or reservation.status.name() == 'CONFIRMED'}"
              th:action="@{/reservations/{id}/cancel(id=${reservation.id})}" method="post"
              onsubmit="return confirm('정말로 예약을 취소하시겠습니까?');" class="m-0">
              <button type="submit" class="btn-danger">
                <i class="bi bi-x-circle"></i> 예약 취소
              </button>
            </form>
          </div>

        </div>
      </div>

    </div>
  </div>
</body>

</html>
