<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="content">

    <!-- 페이지 헤더: 제목 + 회의실 추가 버튼 -->
    <div class="page-header">
      <div>
        <h1 class="page-title">
          <i class="bi bi-door-open color-blue"></i> 회의실 관리
        </h1>
        <p class="page-subtitle">회의실을 추가하고 상태를 관리하세요</p>
      </div>
      <button type="button" class="btn-primary" onclick="document.getElementById('createRoomModal').style.display='flex'">
        <i class="bi bi-plus-lg"></i> 회의실 추가
      </button>
    </div>

    <!-- 회의실 목록 테이블 (활성/비활성 토글 포함) -->
    <div class="card">
      <div th:if="${not #lists.isEmpty(rooms)}" class="overflow-x-auto">
        <table class="data-table w-100">
          <thead>
            <tr>
              <th>ID</th>
              <th>회의실명</th>
              <th>위치</th>
              <th>수용 인원</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="room : ${rooms}">
              <td>
                <span class="text-mono color-sub" style="font-size:0.85rem;"
                      th:text="'#' + ${room.id}">-</span>
              </td>
              <td>
                <div class="d-flex align-center gap-sm">
                  <div class="room-icon-sm">
                    <i class="bi bi-door-open color-blue" style="font-size:0.85rem;"></i>
                  </div>
                  <span class="fw-600" th:text="${room.name}">회의실명</span>
                </div>
              </td>
              <td class="color-sub" th:text="${room.location}">위치</td>
              <td>
                <span class="d-flex align-center gap-xs" style="font-size:0.85rem;">
                  <i class="bi bi-people-fill color-light"></i>
                  <span th:text="${room.capacity} + '명'">0명</span>
                </span>
              </td>
              <td>
                <span th:if="${room.active}"  class="badge badge-confirmed"><i class="bi bi-circle-fill" style="font-size:0.4rem;"></i>사용 가능</span>
                <span th:if="${!room.active}" class="badge badge-cancelled"><i class="bi bi-circle-fill" style="font-size:0.4rem;"></i>사용 불가</span>
              </td>
              <td>
                <form th:action="@{/admin/rooms/{id}/toggle(id=${room.id})}" method="post" class="m-0">
                  <button type="submit" th:class="${room.active} ? 'btn-danger btn-sm' : 'btn-secondary btn-sm'"
                          th:text="${room.active} ? '비활성화' : '활성화'">
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${#lists.isEmpty(rooms)}" class="empty-state">
        <i class="bi bi-building-slash"></i>
        <p>등록된 회의실이 없습니다.</p>
      </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal-overlay" id="createRoomModal" style="display:none;"
         onclick="if(event.target===this)this.style.display='none'">
      <div class="modal-box">
        <form th:action="@{/admin/rooms}" method="post" class="m-0">
          <div class="modal-header">
            <h5 class="modal-title">신규 회의실 등록</h5>
            <button type="button" class="modal-close"
                    onclick="document.getElementById('createRoomModal').style.display='none'">
              <i class="bi bi-x"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <label class="form-label">회의실 이름</label>
              <input type="text" name="name" class="form-control" placeholder="예: 대회의실 A" required>
            </div>
            <div class="mb-2">
              <label class="form-label">위치</label>
              <input type="text" name="location" class="form-control" placeholder="예: 3층 우측">
            </div>
            <div class="mb-2">
              <label class="form-label">수용 인원</label>
              <input type="number" name="capacity" class="form-control" value="4" min="1" required>
            </div>
            <div class="mb-2">
              <label class="form-label">
                설명 <span class="optional-label">(선택)</span>
              </label>
              <textarea name="description" class="form-control" rows="2" placeholder="회의실 특징, 장비 현황 등"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary"
                    onclick="document.getElementById('createRoomModal').style.display='none'">취소</button>
            <button type="submit" class="btn-primary">
              <i class="bi bi-check-lg"></i> 등록하기
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</body>

</html>
