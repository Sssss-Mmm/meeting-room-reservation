<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <div th:fragment="content">

    <!-- 페이지 헤더: 제목 -->
    <div class="page-header">
      <div>
        <h1 class="page-title">
          <i class="bi bi-grid-3x3-gap color-blue"></i> 회의실 목록
        </h1>
        <p class="page-subtitle">예약 가능한 회의실을 확인하세요</p>
      </div>
    </div>

    <!-- 빈 방 찾기: 시간대·인원을 넣으면 그때 예약 가능한 회의실만 보여준다 -->
    <form class="card mb-2" method="get" th:action="@{/rooms}"
          style="padding:1rem;display:flex;flex-wrap:wrap;gap:0.75rem;align-items:flex-end;">
      <div style="flex:1 1 200px;">
        <label class="form-label" for="start">시작</label>
        <input type="datetime-local" id="start" name="start" step="1800" required
               class="form-control" th:value="${searchStart}">
      </div>
      <div style="flex:1 1 200px;">
        <label class="form-label" for="end">종료</label>
        <input type="datetime-local" id="end" name="end" step="1800" required
               class="form-control" th:value="${searchEnd}">
      </div>
      <div style="flex:0 1 120px;">
        <label class="form-label" for="attendees">인원</label>
        <input type="number" id="attendees" name="attendees" min="1" class="form-control" th:value="${searchAttendees != null ? searchAttendees : 1}">
      </div>
      <button type="submit" class="btn-primary"><i class="bi bi-search"></i> 빈 방 찾기</button>
      <a th:if="${availableRooms != null}" th:href="@{/rooms}" class="btn-secondary">전체 보기</a>
    </form>

    <div th:if="${errorMessage}" class="alert-danger mb-2" th:text="${errorMessage}"></div>

    <!-- 검색 결과 -->
    <div th:if="${availableRooms != null}">
      <div class="room-grid" th:if="${not #lists.isEmpty(availableRooms)}">
        <div th:each="room : ${availableRooms}">
          <div th:replace="~{room/card :: roomCard(${room}, ${searchStart}, ${searchEnd}, ${searchAttendees})}"></div>
        </div>
      </div>
      <div class="card" th:if="${#lists.isEmpty(availableRooms)}">
        <div class="empty-state">
          <i class="bi bi-calendar-x"></i>
          <p>해당 시간대에 예약 가능한 회의실이 없습니다.</p>
        </div>
      </div>
    </div>

    <!-- 회의실 카드 그리드 (3열 반응형) -->
    <div class="room-grid" th:if="${availableRooms == null and not rooms.isEmpty()}">
      <!-- 회의실 카드 1개 -->
      <div th:each="room : ${rooms.content}">
        <div th:replace="~{room/card :: roomCard(${room}, null, null, null)}"></div>
      </div>
    </div>


    <!-- 페이지네이션 (총 페이지가 2 이상일 때만 표시) -->
    <div class="pagination" th:if="${availableRooms == null and rooms.totalPages > 1}">
      <a th:href="@{/rooms(page=${rooms.number - 1})}"
        th:class="${rooms.hasPrevious()} ? 'page-btn' : 'page-btn disabled'">
        <i class="bi bi-chevron-left"></i>
      </a>
      <a th:each="i : ${#numbers.sequence(0, rooms.totalPages - 1)}" th:href="@{/rooms(page=${i})}"
        th:class="${i == rooms.number} ? 'page-btn active' : 'page-btn'" th:text="${i + 1}">1</a>
      <a th:href="@{/rooms(page=${rooms.number + 1})}" th:class="${rooms.hasNext()} ? 'page-btn' : 'page-btn disabled'">
        <i class="bi bi-chevron-right"></i>
      </a>
    </div>

    <div class="card" th:if="${availableRooms == null and rooms.isEmpty()}">
      <div class="empty-state">
        <i class="bi bi-building-slash"></i>
        <p>등록된 회의실이 없습니다.</p>
      </div>
    </div>

  </div>
</body>

</html>
