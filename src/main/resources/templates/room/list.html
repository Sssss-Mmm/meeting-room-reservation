<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <div th:fragment="content">

    <div class="page-header">
      <div>
        <h1 class="page-title">
          <i class="bi bi-grid-3x3-gap color-blue"></i> 회의실 목록
        </h1>
        <p class="page-subtitle">예약 가능한 회의실을 확인하세요</p>
      </div>
    </div>

    <div class="room-grid" th:if="${not rooms.isEmpty()}">
      <div th:each="room : ${rooms.content}">
        <div class="card room-card" style="padding:1.5rem;">
          <div>
            <div class="room-card-header">
              <div class="room-icon">
                <i class="bi bi-door-open color-blue" style="font-size:1.2rem;"></i>
              </div>
              <div>
                <h3 class="room-name" th:text="${room.name}">회의실명</h3>
                <p class="room-location" th:text="${room.location}">위치</p>
              </div>
            </div>

            <div class="capacity-badge">
              <i class="bi bi-people-fill"></i>
              최대 <span th:text="${room.capacity}">0</span>명
            </div>

            <p class="color-sub" style="font-size:0.85rem;line-height:1.6;margin:0;" th:text="${room.description}">회의실
              설명</p>
          </div>

          <div class="room-card-footer">
            <a th:href="@{/reservations/new(roomId=${room.id})}" sec:authorize="isAuthenticated()"
              class="btn-secondary w-100 justify-center" style="padding:0.55rem;">
              <i class="bi bi-calendar-plus"></i> 이 회의실 예약
            </a>
            <p sec:authorize="!isAuthenticated()" class="text-center color-sub" style="font-size:0.78rem;margin:0;">
              예약하려면 <a th:href="@{/auth/login}" class="color-blue fw-600" style="text-decoration:none;">로그인</a>이 필요합니다
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${rooms.totalPages > 1}">
      <a th:href="@{/rooms(page=${rooms.number - 1})}"
        th:class="${rooms.hasPrevious()} ? 'page-btn' : 'page-btn disabled'">
        <i class="bi bi-chevron-left"></i>
      </a>
      <a th:each="i : ${#numbers.sequence(0, rooms.totalPages - 1)}" th:href="@{/rooms(page=${i})}"
        th:class="${i == rooms.number} ? 'page-btn active' : 'page-btn'" th:text="${i + 1}">1</a>
      <a th:href="@{/rooms(page=${rooms.number + 1})}" th:class="${rooms.hasNext()} ? 'page-btn' : 'page-btn disabled'">
        <i class="bi bi-chevron-right"></i>
      </a>
    </div>

    <div class="card" th:if="${rooms.isEmpty()}">
      <div class="empty-state">
        <i class="bi bi-building-slash"></i>
        <p>등록된 회의실이 없습니다.</p>
      </div>
    </div>

  </div>
</body>

</html>
