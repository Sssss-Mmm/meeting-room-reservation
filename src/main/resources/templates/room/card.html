<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 회의실 카드 1개. start/end/attendees가 있으면 예약 폼을 그 값으로 미리 채운다 -->
<div th:fragment="roomCard(room, start, end, attendees)" class="card room-card" style="padding:1.5rem;">
  <!-- 카드 상단: 아이콘 + 회의실명 + 위치 + 정원 + 설명 -->
  <div>
    <div class="room-card-header">
      <div class="room-icon">
        <i class="bi bi-door-open color-blue" style="font-size:1.2rem;"></i>
      </div>
      <div>
        <h3 class="room-name" th:text="${room.name}">회의실명</h3>
        <p class="room-location" th:text="${room.location}">위치</p>
      </div>
    </div>

    <div class="capacity-badge">
      <i class="bi bi-people-fill"></i>
      최대 <span th:text="${room.capacity}">0</span>명
    </div>

    <p class="color-sub" style="font-size:0.85rem;line-height:1.6;margin:0;" th:text="${room.description}">회의실
      설명</p>
  </div>

  <!-- 카드 하단: 예약 버튼 (비로그인 시 로그인 유도 문구) -->
  <div class="room-card-footer">
    <a th:href="${start != null}
                  ? @{/reservations/new(roomId=${room.id}, startTime=${start}, endTime=${end}, attendees=${attendees})}
                  : @{/reservations/new(roomId=${room.id})}"
      sec:authorize="isAuthenticated()"
      class="btn-secondary w-100 justify-center" style="padding:0.55rem;">
      <i class="bi bi-calendar-plus"></i> 이 회의실 예약
    </a>
    <p sec:authorize="!isAuthenticated()" class="text-center color-sub" style="font-size:0.78rem;margin:0;">
      예약하려면 <a th:href="@{/auth/login}" class="color-blue fw-600" style="text-decoration:none;">로그인</a>이 필요합니다
    </p>
  </div>
</div>
</body>
</html>
